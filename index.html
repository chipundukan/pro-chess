<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Chess</title>

<!-- jQuery (required for chessboard.js) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Chessboard CSS -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard.min.css">

<!-- Chess.js (game logic) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<!-- Chessboard.js (board UI) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard.min.js"></script>

<!-- Your custom styles -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>♟ Pro Chess</h1>

<div id="board" style="width:90vw; max-width:500px; margin:auto;"></div>

<div class="controls">

<button onclick="undoMove()">Undo Move</button>

<button onclick="resetGame()">Reset Game</button>

</div>

<h3>Move History</h3>

<div id="history"></div>

<!-- Your chess game logic -->
<script src="game.js"></script>

</body>

</html>
